# Test-only datasource: all values are required from the local test environment.
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The isolation initializer verifies the target before Flyway or Hibernate starts.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate

# Startup provisioning is disabled by default. The HTTP integration test opts in
# with a unique, generated test-only admin identity after isolation is verified.
app.admin.bootstrap.enabled=false
app.admin.bootstrap.rotate-existing=false
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173
